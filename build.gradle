plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

repositories {
    mavenCentral()
}

sourceCompatibility = '21'
targetCompatibility = '21'

javafx {
    version = '17.0.10'
    modules = [ 'javafx.controls', 'javafx.fxml', 'javafx.swing' ]
}

dependencies {
    // Dependensi tambahan jika diperlukan
    implementation 'org.apache.pdfbox:pdfbox:3.0.1'
    implementation 'com.williamcallahan:tui4j:0.3.1-preview'
    implementation 'org.json:json:20240303'
    implementation 'io.github.cdimascio:dotenv-java:3.0.0'
}

application {
    mainClass = 'sem3matkul.App'
}

tasks.named('run') {
    standardInput = System.in
}

tasks.register('testPDF', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'sem3matkul.PDFRendererTest'
}

// Dipakai jalankan-cli.sh: start script harus memakai JVM yang sama dengan
// JVM yang meng-compile project (bytecode Java 21).
tasks.register('printJavaHome') {
    doLast { println System.getProperty('java.home') }
}
